<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chatbot</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  body.widget { padding: 0; background: #fff; }
  body.widget .chat-container { height: 100vh; border-radius: 16px; }
  .chat-container {
    width: 100%; max-width: 500px; height: 80vh;
    background: #fff; border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .header {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff; padding: 20px; text-align: center;
  }
  .header h1 { font-size: 18px; }
  .header p { font-size: 12px; opacity: 0.9; margin-top: 4px; }
  .messages { flex: 1; overflow-y: auto; padding: 20px; background: #f7f8fc; }
  .msg {
    max-width: 80%; padding: 12px 16px; border-radius: 16px;
    margin-bottom: 12px; line-height: 1.5; font-size: 14px;
    white-space: pre-wrap; word-wrap: break-word;
  }
  .msg.user {
    background: #667eea; color: #fff;
    margin-right: auto; border-bottom-right-radius: 4px;
  }
  .msg.bot {
    background: #fff; color: #333; margin-left: auto;
    border: 1px solid #e5e7eb; border-bottom-left-radius: 4px;
  }
  .msg.typing { color: #999; font-style: italic; }
  .input-area {
    display: flex; padding: 15px; background: #fff;
    border-top: 1px solid #e5e7eb; gap: 10px;
  }
  .input-area input {
    flex: 1; padding: 12px 16px; border: 1px solid #e5e7eb;
    border-radius: 24px; font-size: 14px; outline: none;
    font-family: inherit;
  }
  .input-area input:focus { border-color: #667eea; }
  .input-area button {
    padding: 12px 24px; background: #667eea; color: #fff;
    border: none; border-radius: 24px; cursor: pointer;
    font-weight: bold; font-family: inherit;
  }
  .input-area button:hover { background: #5568d3; }
  .input-area button:disabled { background: #ccc; cursor: not-allowed; }
</style>
</head>
<body>
<div class="chat-container">
  <div class="header">
    <h1>💬 مساعد ذكي</h1>
    <p>اسألني أي حاجة عن خدماتنا</p>
  </div>
  <div class="messages" id="messages">
    <div class="msg bot">أهلاً! 👋 إزاي أقدر أساعدك؟</div>
  </div>
  <div class="input-area">
    <input id="input" type="text" placeholder="اكتب رسالتك..." autocomplete="off">
    <button id="send">إرسال</button>
  </div>
</div>

<script>
if (new URLSearchParams(location.search).get('widget')) {
  document.body.classList.add('widget');
}

const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');

let history = [];
let sessionId = localStorage.getItem('chat_session');
if (!sessionId) {
  sessionId = 'sess_' + Date.now() + '_' + Math.random().toString(36).slice(2);
  localStorage.setItem('chat_session', sessionId);
}

function addMessage(text, role) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;

  addMessage(text, 'user');
  inputEl.value = '';
  sendBtn.disabled = true;

  const typingEl = addMessage('يكتب...', 'bot');
  typingEl.classList.add('typing');

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, history, sessionId })
    });

    const data = await res.json();
    typingEl.remove();

    if (data.reply) {
      addMessage(data.reply, 'bot');
      history.push({ role: 'user', content: text });
      history.push({ role: 'assistant', content: data.reply });
      history = history.slice(-10);
    } else {
      addMessage('عذراً، حدث خطأ. جرب تاني.', 'bot');
    }
  } catch (err) {
    typingEl.remove();
    addMessage('مشكلة في الاتصال بالسيرفر.', 'bot');
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

sendBtn.addEventListener('click', sendMessage);
inputEl.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') sendMessage();
});
inputEl.focus();
</script>
</body>
</html>
